name: Smarter Kettle
products:
  - model: SMCOF01
    name: Smarter Coffee V2
primary_entity:
  entity: sensor
  state_field: state
  translation_key: state
  icon: "mdi:coffee"
secondary_entities:
  - entity: sensor
    translation_key: brewed_keeping_warm
    state_field: brewed_keeping_warm.ts
    device_class: timestamp
    enabled_default: false
  - entity: sensor
    translation_key: brewing_started
    state_field: brewing_started.ts
    enabled_default: false
    unit: datetime
  - entity: sensor
    translation_key: number_of_cups_since_descale
    state_class: measurement
    icon: mdi:dots-circle
  - entity: sensor
    translation_key: water_level
    state_class: measurement
    icon: "mdi:cup-water"
  - entity: sensor
    translation_key: coffee_soak_percentage
    state_class: measurement
  - entity: sensor
    translation_key: coffee_custom_brew_time
  - entity: sensor
    translation_key: coffee_custom_grind_time
    state_class: measurement
  - entity: sensor
    translation_key: keep_warm_time
    unit: minutes
    state_class: measurement
    icon: "mdi:clock"
  - entity: sensor
    translation_key: keep_warm_time_remaining
    unit: minutes
    state_class: measurement
    icon: "mdi:clock"
  - entity: binary_sensor
    translation_key: cup_mode_enable
    icon: "mdi:cup"
  - entity: binary_sensor
    translation_key: carafe_is_present
  - entity: select
    translation_key: coffee_strength
    state_field: coffee_strength
    setter: set_coffee_strength
    mapping:
      - value: 20
        native_value: "Weak"
      - value: 50
        native_value: "Medium"
      - value: 80
        native_value: "Strong"
    setter_mapping:
      - value: 20
        native_value: "Weak"
      - value: 50
        native_value: "Medium"
      - value: 80
        native_value: "Strong"
  - entity: number
    translation_key: coffee_strength
    state_class: measurement
    setter: set_coffee_strength
    mapping:
      - value: 20
        native_value: "Weak"
      - value: 50
        native_value: "Medium"
      - value: 80
        native_value: "Strong"
    icon: "mdi:wifi-strength-1"
  - entity: number
    translation_key: number_of_cups
    unit: "cups"
    state_class: measurement
    icon: "mdi:cup"
    setter: set_number_of_cups
    range:
      min: 1
      max: 12
    step: 1
  - entity: number
    translation_key: preheat_time
    unit: seconds
    device_class: duration
    setter: set_preheat_time
    state_class: measurement
    icon: "mdi:clock"
    range:
      min: 0
      max: 300
    step: 60
  - entity: number
    translation_key: keep_warm_time
    unit: minutes
    device_class: duration
    setter: set_keep_warm_time
    state_class: measurement
    icon: "mdi:clock"
    range:
      min: 0
      max: 40
    step: 10
  - entity: switch
    translation_key: grind_enable
    icon: "mdi:football-australian"
    setter: set_grind_enable
  - entity: switch
    translation_key: is_brewing
    state_field: state
    icon: "mdi:coffee"
    setter_mapping:
      - value: false
        setter: stop_brew
        native_value: true
      - value: true
        setter: start_brew
        native_value: true
    mapping:
      - native_value: "Brewing"
        value: true
      - native_value: "Keeping warm"
        value: true
      - default: true
        value: false
